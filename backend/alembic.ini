[alembic]
# path to migration scripts
script_location = alembic

# database to connect to (async URL from .env / settings)
sqlalchemy.url = sqlite+aiosqlite:///./uzex_ai_dev.db

# version location
version_locations = alembic/versions

# max length of characters to apply to the
# "version" column
max_length_varchar = 255

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
