[project]
name = "uzex-ai-backend"
version = "1.0.0"
description = "UZEX AI Backend — analytical API for Uzbekistani commodity exchange deals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.35.0,<0.36.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "alembic>=1.15.0,<1.16.0",
    "pydantic>=2.10.3,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.9,<0.0.10",
    "httpx>=0.28.1,<0.29.0",
    "redis>=5.0.0,<6.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.26.0,<0.27.0",
    "ruff>=0.17.0,<0.18.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "RUF"]
ignore = ["E501", "B008", "N806", "N803", "RUF001", "RUF002", "UP046", "F821", "N818", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["name-defined", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
